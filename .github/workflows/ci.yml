name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  packages: read

jobs:
  runner-base-conformance:
    name: Runner base v001 conformance and Terraform domain contract
    uses: gehorak/runner-base/.github/workflows/derived-conformance.yml@4bd01b01ab063a4f3bd2ce8bd3748577beb9e71f
    with:
      image: runner-terraform:conformance
      build_context: .
      dockerfile: Dockerfile
      base_reference: ghcr.io/gehorak/runner-base:0.3.0@sha256:8e663302934d78f5edd77f7c07cf3f66813085f1922f5a27ad379a6ca6831003
      expected_contract_version: v001
      conformance_ref: 4bd01b01ab063a4f3bd2ce8bd3748577beb9e71f
      tools_lock_path: contracts/tools-lock/v001/tools.lock.json
      domain_test_path: ci/test-domain.sh
