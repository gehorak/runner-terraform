name: Release image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: runner-terraform-release
  cancel-in-progress: false

env:
  BASE_REFERENCE: ghcr.io/gehorak/runner-base:0.3.2@sha256:23ca54058c01e5362e89c2746f794b637584842df803992d8568f64d302a8cf0
  CONFORMANCE_REF: 5803155a3fe9e737668cdc196bc768f46727ec50
  CONTRACT_VERSION: v001

jobs:
  release:
    name: Build, verify, and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag (SemVer)
        id: semver
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: invalid release tag '${TAG}'" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "version_mm=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            echo "commit=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Ensure tag is on main and increases version
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "ERROR: release tag must point exactly at origin/main HEAD" >&2
            exit 1
          }
          highest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx '${{ steps.semver.outputs.tag }}' | sort -V | tail -n 1 || true)"
          if [[ -n "${highest}" ]] && [[ "$(printf '%s\n%s\n' "${highest#v}" '${{ steps.semver.outputs.version }}' | sort -V | tail -n 1)" != '${{ steps.semver.outputs.version }}' ]]; then
            echo "ERROR: release version must be higher than ${highest}" >&2
            exit 1
          fi

      - name: Prepare tag-bound release build context
        shell: bash
        env:
          TAG: ${{ steps.semver.outputs.tag }}
          COMMIT: ${{ steps.semver.outputs.commit }}
        run: |
          set -Eeuo pipefail
          rm -rf release-context
          mkdir release-context
          git archive --format=tar HEAD | tar -x -C release-context
          python3 ci/prepare-release-manifest.py \
            --input image.manifest \
            --output release-context/image.manifest \
            --tag "${TAG}" \
            --revision "${COMMIT}"

      - name: Define Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/gehorak/runner-terraform
          tags: |
            type=raw,value=${{ steps.semver.outputs.version }}
            type=raw,value=${{ steps.semver.outputs.version_mm }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=runner-terraform
            org.opencontainers.image.description=Deterministic Terraform runner derived from runner-base
            org.opencontainers.image.source=https://github.com/gehorak/runner-terraform
            org.opencontainers.image.version=${{ steps.semver.outputs.version }}
            org.opencontainers.image.revision=${{ steps.semver.outputs.commit }}
            org.opencontainers.image.base.name=${{ env.BASE_REFERENCE }}

      - name: Build tag-bound release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release-context
          load: true
          platforms: linux/amd64
          build-args: BASE_IMAGE=${{ env.BASE_REFERENCE }}
          tags: |
            runner-release:test
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run tag-bound derived conformance
        shell: bash
        env:
          IMAGE: runner-release:test
          EXPECTED_IMAGE_VERSION: ${{ steps.semver.outputs.version }}
          EXPECTED_IMAGE_REVISION: ${{ steps.semver.outputs.commit }}
        run: |
          set -Eeuo pipefail
          bash ci/run-release-candidate-checks.sh

      - name: Scan exact tested release candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-artifacts
          docker image save runner-release:test --output release-artifacts/runner-release.test.tar
          docker run --rm --volume "${PWD}:/work:ro" \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /work/release-artifacts/runner-release.test.tar \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Generate SPDX SBOM for tested image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: runner-release:test
          format: spdx-json
          output-file: release-artifacts/runner-terraform-${{ steps.semver.outputs.version }}.sbom.spdx.json
          artifact-name: runner-terraform-${{ steps.semver.outputs.version }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.46.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable release recovery state
        id: existing-release
        shell: bash
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          set -Eeuo pipefail
          reference="ghcr.io/gehorak/runner-terraform:${VERSION}"
          existing_config_digest="absent"
          if docker manifest inspect "${reference}" >/dev/null 2>&1; then
            raw_manifest="$(docker buildx imagetools inspect --raw "${reference}")"
            existing_config_digest="$(printf '%s' "${raw_manifest}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["config"]["digest"])')"
          fi
          echo "config_digest=${existing_config_digest}" >> "${GITHUB_OUTPUT}"

      - name: Publish or resume immutable tested image
        id: publication
        shell: bash
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          EXISTING_CONFIG_DIGEST: ${{ steps.existing-release.outputs.config_digest }}
        run: |
          set -Eeuo pipefail
          candidate_config_digest="$(docker image inspect runner-release:test --format '{{.Id}}')"
          mode="$(python3 ci/release-publication-state.py \
            --existing-config-digest "${EXISTING_CONFIG_DIGEST}" \
            --candidate-config-digest "${candidate_config_digest}")"
          if [[ "${mode}" == publish ]]; then
            docker image tag runner-release:test "ghcr.io/gehorak/runner-terraform:${VERSION}"
            docker image push "ghcr.io/gehorak/runner-terraform:${VERSION}"
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Resolve published image digest
        id: digests
        shell: bash
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          set -Eeuo pipefail
          reference="ghcr.io/gehorak/runner-terraform:${VERSION}"
          digest="sha256:$(docker buildx imagetools inspect --raw "${reference}" | sha256sum | cut -d ' ' -f 1)"
          {
            echo "reference=${reference}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest published image provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gehorak/runner-terraform
          subject-digest: ${{ steps.digests.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest published image SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gehorak/runner-terraform
          subject-digest: ${{ steps.digests.outputs.digest }}
          sbom-path: release-artifacts/runner-terraform-${{ steps.semver.outputs.version }}.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Write release evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ci/write-release-evidence.py \
            --output release-artifacts/runner-terraform-${{ steps.semver.outputs.version }}.release-evidence.json \
            --tag '${{ steps.semver.outputs.tag }}' \
            --commit '${{ steps.semver.outputs.commit }}' \
            --image-reference '${{ steps.digests.outputs.reference }}' \
            --image-digest '${{ steps.digests.outputs.digest }}' \
            --parent-reference '${{ env.BASE_REFERENCE }}' \
            --conformance-ref '${{ env.CONFORMANCE_REF }}' \
            --sbom runner-terraform-${{ steps.semver.outputs.version }}.sbom.spdx.json \
            --provenance-attestation '${{ steps.attest-provenance.outputs.attestation-url }}' \
            --sbom-attestation '${{ steps.attest-sbom.outputs.attestation-url }}'

      - name: Publish release evidence assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            release-artifacts/runner-terraform-${{ steps.semver.outputs.version }}.release-evidence.json
            release-artifacts/runner-terraform-${{ steps.semver.outputs.version }}.sbom.spdx.json
          fail_on_unmatched_files: true

      - name: Publish convenience aliases after immutable evidence
        shell: bash
        env:
          VERSION_MM: ${{ steps.semver.outputs.version_mm }}
          PUBLISHED_DIGEST: ${{ steps.digests.outputs.digest }}
        run: |
          set -Eeuo pipefail
          for alias in "${VERSION_MM}" latest; do
            reference="ghcr.io/gehorak/runner-terraform:${alias}"
            docker image tag runner-release:test "${reference}"
            docker image push "${reference}"
            observed_digest="sha256:$(docker buildx imagetools inspect --raw "${reference}" | sha256sum | cut -d ' ' -f 1)"
            [[ "${observed_digest}" == "${PUBLISHED_DIGEST}" ]] || {
              echo "ERROR: convenience alias ${alias} does not match the immutable published digest" >&2
              exit 1
            }
          done
